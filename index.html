<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎥 Advanced Movie Finder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(270deg, #0f2027, #203a43, #2c5364);
      background-size: 600% 600%;
      animation: gradientAnimation 15s ease infinite;
      color: #ffffff;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #00f7ff;
      text-shadow: 0 0 12px #00f7ffaa;
    }

    .search-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    input[type="text"] {
      padding: 12px 16px;
      width: 280px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #00cccc;
      transform: scale(1.05);
    }

    #loader {
      display: none;
      margin: 20px auto;
      border: 6px solid #ffffff33;
      border-top: 6px solid #00ffff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #result {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      max-width: 1200px;
      width: 100%;
    }

    .movie-card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.1);
    }

    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 6px 20px rgba(0, 255, 255, 0.4);
    }

    .movie-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 10px;
    }

    .movie-card h3 {
      margin-top: 10px;
      font-size: 18px;
      color: #00f7ff;
    }

    .movie-card span {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #ccc;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 0, 0, 0.95);
      padding: 30px;
      border-radius: 14px;
      color: #ffffff;
      text-align: center;
      z-index: 10;
      width: 80%;
      max-width: 400px;
      transition: transform 0.3s ease;
    }

    .modal.active {
      transform: translate(-50%, -50%) scale(1);
    }

    .modal h2 {
      margin-bottom: 10px;
      color: #00ffff;
    }

    .modal p {
      font-size: 15px;
      margin-bottom: 20px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      background: #000000aa;
      width: 100%;
      height: 100%;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      input[type="text"] {
        width: 100%;
      }

      .search-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h1>🎬 Advanced Movie Finder</h1>
  <div class="search-container">
    <input type="text" id="search" placeholder="Enter movie name..." />
    <button onclick="searchMovie()">Search</button>
  </div>
  <div id="loader"></div>
  <div id="result"></div>

  <div class="overlay" id="overlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-content"></p>
    <button onclick="closeModal()">Close</button>
  </div>

</body>
<script src="script.js"></script>
</html>
